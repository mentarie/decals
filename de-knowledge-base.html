<meta charset="utf-8">
<title>Data Engineering Knowledge Base</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: masthead + rail tab sticky; tiap topik = panel dengan sub-tab;
   wizard & kalkulator dua kolom (input | hasil), satu kolom di mobile.
   Tanpa web font: semua tipografi memakai font sistem agar tidak ada request jaringan. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF2; --ink:#14202C; --muted:#536172;
  --line:#D3DAE3; --accent:#2A4FC4; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB;
  --mark:#FFE08A; --mark-ink:#14202C;
  --good:#1D7448; --good-soft:#DFF2E7; --warn:#8F5600; --warn-soft:#FBEFD8; --bad:#B42318; --bad-soft:#FBE3E0;
  --bar:#A3B0C0;
  --font-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#151D26; --surface-2:#1C2631; --ink:#E5EBF1; --muted:#9AA8B8;
    --line:#2A3746; --accent:#8EA6FF; --accent-ink:#0E141B; --accent-soft:#1D2A4C;
    --mark:#7A5C0E; --mark-ink:#FFF6D8;
    --good:#5DD39A; --good-soft:#11311F; --warn:#F2B55E; --warn-soft:#37280F; --bad:#FF8C7D; --bad-soft:#3B1915;
    --bar:#4B5A6B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#151D26; --surface-2:#1C2631; --ink:#E5EBF1; --muted:#9AA8B8;
  --line:#2A3746; --accent:#8EA6FF; --accent-ink:#0E141B; --accent-soft:#1D2A4C;
  --mark:#7A5C0E; --mark-ink:#FFF6D8;
  --good:#5DD39A; --good-soft:#11311F; --warn:#F2B55E; --warn-soft:#37280F; --bad:#FF8C7D; --bad-soft:#3B1915;
  --bar:#4B5A6B; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1280px;margin-inline:auto}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
ul,ol{margin:0;padding:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font:500 11.5px/1.3 var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.h-sm{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--font-mono);font-weight:500}

/* Masthead */
.mast{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-block:22px 14px}
.mast h1{font-size:clamp(22px,3vw,30px);font-weight:700}
.mast-stats{display:flex;gap:18px;flex-wrap:wrap}
.mast-stats div{display:flex;flex-direction:column}
.mast-stats b{font:600 18px/1.1 var(--font-mono)}
.mast-stats span{font-size:12px;color:var(--muted)}

/* Tab utama */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs [role=tab]{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:11px 14px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs [role=tab]:hover{color:var(--ink)}
.tabs [role=tab][aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs [role=tab]:focus-visible{outline-offset:-3px}

/* Panel topik */
main{padding-block:20px 8px}
.topic-head{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.th-text{max-width:62ch;display:grid;gap:6px;min-width:0}
.th-text h2{font-size:clamp(20px,2.6vw,26px)}
.lede{color:var(--muted)}
.searchbox{display:grid;gap:4px;width:min(100%,420px)}
.searchbox label{font-size:12.5px;font-weight:600}
input[type=search],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:38px}
input[type=search]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input[aria-invalid=true]{border-color:var(--bad)}
.search-status{font-size:12.5px;color:var(--muted);min-height:1.2em}
mark.hl{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}
.s-miss{display:none!important}
.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

/* Sub-tab */
.subtabs,.inner-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.subtabs [role=tab],.inner-tabs [role=tab]{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.subtabs [role=tab][aria-selected=true],.inner-tabs [role=tab][aria-selected=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.cnt{font:600 11px/1 var(--font-mono);background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 6px}
.inner-tabs [role=tab]{border-radius:6px;font-size:13.5px}

/* Tombol & kontrol umum */
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13.5px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px;border:0;margin:0;padding:0;min-width:0}
.seg legend{padding:0}
.seg-opt{position:relative;cursor:pointer}
.seg-opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg-opt span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;font-size:13.5px}
.seg-opt input:checked + span{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.seg-opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.badge{display:inline-flex;align-items:center;gap:4px;font:500 11.5px/1.5 var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap;color:var(--muted)}
.badge.oss{color:var(--good);border-color:currentColor}
.badge.ent{color:var(--accent);border-color:currentColor}
.badge.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.badge.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.badge.good{color:var(--good);background:var(--good-soft);border-color:transparent}
.tag{font:500 12px/1.5 var(--font-mono);background:var(--surface-2);border-radius:4px;padding:1px 7px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.alert{border-radius:6px;padding:8px 10px;font-size:13.5px;border-left:3px solid currentColor}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--accent-soft);color:var(--ink);border-left-color:var(--accent)}
.alert.good{background:var(--good-soft);color:var(--good)}
.alert span{color:var(--ink)}
details.formula{margin-top:8px}
details.formula summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);width:max-content}
details.formula pre{margin:8px 0 0;padding:10px 12px;background:var(--surface-2);border-radius:6px;font:12.5px/1.6 var(--font-mono);white-space:pre-wrap;overflow-x:auto}
.disclaimer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

/* Daftar isi */
.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.toc-card{display:grid;gap:10px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;color:inherit;text-decoration:none;transition:border-color .15s}
.toc-card:hover{border-color:var(--accent)}
.toc-card h3{font-size:19px}
.toc-card .secs{font-size:13px;color:var(--muted)}
.snips{display:grid;gap:4px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.snips p{color:var(--muted)}

/* Wizard */
.wiz{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
.wiz-main{display:grid;gap:16px;min-width:0}
.preset-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:8px;margin-top:8px}
.preset{appearance:none;text-align:left;display:grid;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.preset:hover{border-color:var(--accent)}
.preset[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.preset strong{font-size:14px}
.preset span{font-size:12.5px;color:var(--muted)}
.wiz-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.progress{font:500 13px var(--font-mono);color:var(--muted)}
.crit-list{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.crit{display:grid;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
.crit:first-child{border-top:0}
.crit-q{display:flex;gap:12px}
.crit-no{font:500 12px/1.6 var(--font-mono);color:var(--muted);padding-top:1px}
.crit h4{font-size:15px;font-weight:600}
.help{font-size:13px;color:var(--muted)}
.imp{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.imp input{width:140px;accent-color:var(--accent)}
.imp output{font:600 13px var(--font-mono);color:var(--ink);min-width:2ch}
.wiz-result{position:sticky;top:60px;display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-height:calc(100vh - 80px);overflow:auto;min-width:0}
.rec{background:var(--accent-soft);border-radius:6px;padding:10px 12px}
.rec b{display:block;font-size:17px;font-family:var(--font-display);margin-top:2px}
.res-step{display:grid;gap:8px}
.res-step h4{font-size:14px;display:flex;justify-content:space-between;gap:8px}
.dbars{display:grid;gap:6px}
.dbar{display:grid;grid-template-columns:minmax(0,9.5rem) 1fr 3.2rem;gap:8px;align-items:center;font-size:13px}
.dbar-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbar-track{position:relative;height:14px;background:var(--surface-2);border-radius:3px}
.dbar-track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.dbar-fill{position:absolute;top:0;bottom:0;background:var(--bar);border-radius:2px}
.dbar.win .dbar-fill.pos{background:var(--accent)}
.dbar.win .dbar-l{font-weight:700}
.dbar-v{font:500 12.5px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.res-list{display:grid;gap:6px;padding-left:18px;font-size:13.5px}
.res-block{display:grid;gap:6px}
.res-block h4{font-size:14px}

/* Tool explorer */
.tx{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.tx-main{display:grid;gap:18px;min-width:0}
.filters{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.frow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.frow > .flabel{font-size:12.5px;font-weight:600;min-width:72px}
.frow select{width:auto;min-width:220px;max-width:100%}
.fitnote{font-size:13px;color:var(--muted)}
.cat{display:grid;gap:10px}
.cat-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.cat-h h3{font-size:17px}
.cat-h p{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.tool{display:grid;gap:9px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;min-width:0}
.tool.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tool-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tool h4{font-size:16px}
.pick{appearance:none;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;padding:3px 10px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.pick[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.k{display:block;font:500 11px/1.4 var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.tool p,.tool li{font-size:13.5px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc ul{padding-left:16px;display:grid;gap:2px}
.fitwhy{font-size:12.5px;color:var(--warn)}
.upd{font:12px var(--font-mono);color:var(--muted)}
.stack{position:sticky;top:60px;display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-height:calc(100vh - 80px);overflow:auto}
.stack-head{display:flex;justify-content:space-between;align-items:baseline}
.stack-head h3{font-size:18px}
.flow svg{display:block;width:100%;max-width:340px;height:auto}
.fl-box{fill:var(--surface);stroke:var(--line);stroke-width:1}
.fl-box.on{fill:var(--accent-soft);stroke:var(--accent)}
.fl-box.off{stroke-dasharray:4 3}
.fl-k{fill:var(--muted);font:500 9.5px var(--font-mono);text-transform:uppercase;letter-spacing:.06em}
.fl-n{fill:var(--ink);font:600 13px var(--font-ui)}
.fl-n.sm{font-size:11px}
.fl-n.off{fill:var(--muted);font-weight:400;font-style:italic}
.fl-a{stroke:var(--muted);stroke-width:1.5}
.fl-ah{fill:var(--muted)}
.stack-list{list-style:none;display:grid;font-size:13px}
.stack-list li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--line)}
.stack-list li span{color:var(--muted)}
.stack-list li b{text-align:right}
.cluster{background:var(--surface-2);border-radius:6px;padding:8px 10px;font-size:13px}
.warns{display:grid;gap:6px}

/* Kalkulator */
.calc-summary{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;display:grid;gap:8px}
.calc-summary p{font-size:14.5px}
.calc-summary b{font-variant-numeric:tabular-nums}
.calc{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
.calc-form{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:sticky;top:60px;max-height:calc(100vh - 80px);overflow:auto}
.fgroup{display:grid;gap:12px;border:0;padding:0;margin:0;min-width:0}
.fgroup > legend,.fgroup > summary{font:500 12px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0;margin-bottom:2px}
details.fgroup > summary{cursor:pointer;color:var(--accent)}
details.fgroup[open] > summary{margin-bottom:10px}
.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:600}
.unit{font-weight:400;color:var(--muted)}
.fh{font-size:12px;color:var(--muted)}
.err{font-size:12px;color:var(--bad)}
.warnmsg{font-size:12px;color:var(--warn)}
.inline{display:grid;grid-template-columns:1fr 84px;gap:6px}
.check{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:400!important}
.check input{accent-color:var(--accent);width:16px;height:16px}
.calc-out{display:grid;gap:14px;min-width:0}
.step{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.step header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.step-no{font:500 12px var(--font-mono);color:var(--accent)}
.step h4{font-size:16px;flex:1 1 auto}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:6px 14px;margin:0}
.kv div{display:grid}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{margin:0;font:500 14px var(--font-mono);font-variant-numeric:tabular-nums}
.result{display:flex;flex-wrap:wrap;gap:8px 22px}
.big{display:grid}
.big b{font:600 22px/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
.big span{font-size:12px;color:var(--muted)}
.interp{font-size:13.5px;color:var(--muted);font-style:italic}
.note{font-size:13px;background:var(--surface-2);border-radius:6px;padding:8px 10px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;background:var(--surface-2);font:500 11.5px var(--font-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
tr.hi td{font-weight:700}
.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:minmax(0,8.5rem) 1fr 5.5rem;gap:8px;align-items:center;font-size:13px}
.hb-t{position:relative;height:16px;background:var(--surface-2);border-radius:3px}
.hb-f{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:3px}
.hb-f.ok{background:var(--accent)}
.hb-ref{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad)}
.hb-v{font:500 12.5px var(--font-mono);text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:6px;background:var(--accent)}
.legend i.alt{background:var(--bar)}
.legend i.ref{background:var(--bad);width:3px;height:12px}
.chart svg{display:block;width:100%;height:auto}
.ax{stroke:var(--line);stroke-width:1}
.ax-t{fill:var(--muted);font:11px var(--font-mono)}
.ln{fill:none;stroke-width:2.2}
.ln.a{stroke:var(--accent)}
.ln.b{stroke:var(--bar);stroke-dasharray:5 4}
.dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.dot-t{fill:var(--ink);font:600 11px var(--font-mono)}
.cost-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.cost{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:6px}
.cost.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cost h5{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.cost dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:0;font-size:13px}
.cost dd{margin:0;text-align:right;font-family:var(--font-mono)}
.cost .tot{border-top:1px solid var(--line);padding-top:4px;font-weight:700}

/* Catatan & checklist */
.notes{display:grid;gap:12px}
.note-e{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:80ch}
.note-e h4{font-size:16px}
.note-meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font:12px var(--font-mono);color:var(--muted)}
.note-src{font-size:12.5px;color:var(--muted)}
.cl-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:grid;gap:4px}
.cl-group h4{font-size:15px;margin-bottom:4px}
.cl-item{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.cl-item input{accent-color:var(--accent);width:17px;height:17px;margin-top:2px;flex:none}
.cl-item label{display:grid;gap:2px;cursor:pointer}
.cl-item small{color:var(--muted);font-size:12.5px}
.cl-wrap{display:grid;gap:12px;max-width:820px}

/* Footer, toast, copy fallback */
footer{border-top:1px solid var(--line);margin-top:28px;padding-block:18px 28px;display:grid;gap:12px;font-size:13.5px}
footer details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;max-width:900px}
footer summary{cursor:pointer;font-weight:600}
.howto{display:grid;gap:12px;margin-top:10px}
.howto h4{font-size:14px}
.howto pre{margin:6px 0 0;padding:10px 12px;background:var(--surface-2);border-radius:6px;font:12px/1.55 var(--font-mono);overflow-x:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13.5px;z-index:20;max-width:calc(100% - 32px)}
.copybox{position:fixed;inset:auto max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:560px;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;z-index:21;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.copybox textarea{font:12px/1.5 var(--font-mono);resize:vertical}

@media (max-width:1100px){ .tx{grid-template-columns:minmax(0,1fr)} .stack{position:static;max-height:none} }
@media (max-width:960px){
  .wiz,.calc{grid-template-columns:minmax(0,1fr)}
  .wiz-result,.calc-form{position:static;max-height:none}
}
@media (max-width:520px){ .pc{grid-template-columns:1fr} .dbar{grid-template-columns:minmax(0,6.5rem) 1fr 2.8rem} .hb{grid-template-columns:minmax(0,5.5rem) 1fr 4.6rem} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;scroll-behavior:auto!important} }

      /* ---------- C. Sizing Calculator ---------- */
      sizing: {
        spark: {
          defaults: { volume: 1, unit: "TB", decimal: false, partitionMB: 128, nodes: 12, coresPerNode: 16, ramPerNodeGB: 64, usablePct: 70, execPerNode: 4, memPerTaskGB: 1.5, expansion: 3, diskMBs: 500, slaMin: 30, smallTableMB: 200 },
          fields: [
            { id: "partitionMB", label: "Target ukuran partisi", unit: "MB", help: "Umumnya 128–256 MB per partisi." },
            { id: "nodes", label: "Jumlah worker node", unit: "node", step: 1 },
            { id: "coresPerNode", label: "Core per node", unit: "core", step: 1 },
            { id: "ramPerNodeGB", label: "RAM per node", unit: "GB" },
            { id: "usablePct", label: "RAM usable untuk Spark", unit: "%", max: 100, help: "Sisanya untuk OS, overhead JVM, dan daemon." },
            { id: "execPerNode", label: "Executor per node", unit: "executor", step: 1, help: "Sebaiknya habis membagi core per node." },
            { id: "memPerTaskGB", label: "Batas memori per task", unit: "GB", options: [1, 1.5, 2, 3] },
            { id: "expansion", label: "Faktor ekspansi shuffle/join", unit: "x", help: "Rasio data shuffle terhadap data input." },
            { id: "diskMBs", label: "Throughput disk", unit: "MB/s", help: "Per node, baca/tulis sekuensial." },
            { id: "slaMin", label: "SLA target waktu", unit: "menit" },
            { id: "smallTableMB", label: "Ukuran tabel terkecil di join", unit: "MB", help: "Dipakai aturan broadcast join." }
          ],
          formulas: {
            s1: "total_GB      = volume × B             (B = 1.024 biner, atau 1.000 desimal; hanya jika satuan TB)\ntotal_partisi = ceil(total_GB × B ÷ ukuran_partisi_MB)",
            s2: "task_paralel = node × core_per_node\nwaves        = ceil(total_partisi ÷ task_paralel)",
            s3: "mem_usable_per_node     = RAM_per_node × persen_usable\nmem_per_executor        = mem_usable_per_node ÷ executor_per_node\ncore_per_executor       = floor(core_per_node ÷ executor_per_node)\nmax_task_by_memory      = floor(mem_per_executor ÷ batas_memori_per_task)\ntask_efektif_per_executor = min(core_per_executor, max_task_by_memory)\nRisiko OOM jika core_per_executor > max_task_by_memory",
            s4: "shuffle_GB                 = total_GB × faktor_ekspansi\nthroughput_GB_s            = throughput_MB_s ÷ B\nwaktu_shuffle_worst (menit) = shuffle_GB ÷ throughput_GB_s ÷ 60          (satu disk)\nwaktu_shuffle_best  (menit) = shuffle_GB ÷ (throughput_GB_s × node) ÷ 60 (semua disk paralel)",
            s5: "faktor_scale            = waktu_shuffle_worst ÷ SLA\na) node_baru            = ceil(node × faktor_scale)\nb) core_baru            = ceil(core_per_node × faktor_scale)\nc) ekspansi_target      = faktor_ekspansi × SLA ÷ waktu_shuffle_worst\nAsumsi: waktu turun linear terhadap paralelisme."
          },

          rules: [
            { metric: "expansion", op: ">=", value: 2, level: "warn", text: "Faktor ekspansi ≥ 2x: lakukan repartition pada join key, gunakan broadcast join untuk tabel kecil, atau redesain logika join (filter dan pilih kolom sebelum join)." },
            { metric: "expansion", op: "<", value: 2, level: "good", text: "Ekspansi < 2x: shuffle relatif ringan. Fokus pada ukuran partisi dan data skew." },
            { metric: "smallTableMB", op: "<=", value: 512, level: "good", text: "Tabel terkecil ≤ 512 MB: gunakan broadcast join (hint BROADCAST) agar sisi tabel besar tidak perlu di-shuffle. Default spark.sql.autoBroadcastJoinThreshold hanya 10 MB, jadi hint eksplisit sering diperlukan. Batas 512 MB adalah rule of thumb dan perlu divalidasi terhadap memori driver/executor." },
            { metric: "waves", op: ">", value: 20, level: "info", text: "Lebih dari 20 waves: tambah paralelisme atau perbesar ukuran partisi agar overhead penjadwalan task berkurang." },
            { metric: "partitionMB", op: ">", value: 256, level: "warn", text: "Partisi > 256 MB menaikkan risiko spill ke disk dan OOM per task." }
          ]

function niceMax(v) {

function wizardScores(W, ws) {
  const opts = {};
  W.steps.forEach(s => s.options.forEach(o => { opts[o.id] = { score: 0, contrib: [] }; }));
  let answered = 0;
  W.criteria.forEach(c => {
    const a = c.answers.find(x => x.id === ws.answers[c.id]);
    if (!a) return;
    answered++;
    const imp = ws.importance[c.id];
    Object.entries(a.scores).forEach(([o, raw]) => {
      if (!opts[o]) return;
      const val = raw * imp;
      opts[o].score += val;
      opts[o].contrib.push({ crit: c, ans: a, raw, imp, val });
    });
  });
  const steps = W.steps.map(s => {
    const list = s.options.map(o => Object.assign({}, o, opts[o.id]));
    const max = Math.max(...list.map(o => o.score));
    const top = list.filter(o => o.score === max);
    return { step: s, list, winner: answered ? top[0] : null, tie: answered && top.length > 1 ? top : null };
  });
  steps.forEach(r => {
    const cond = r.step.showIf;
    const ref = cond && steps.find(x => x.step.id === cond.step);
    r.visible = !cond || (!!ref.winner && cond.anyOf.includes(ref.winner.id));
  });
  return { steps, answered };
}

function sparkCalc(v) {
  const B = v.decimal ? 1000 : 1024, altB = v.decimal ? 1024 : 1000;
  const toGB = base => v.unit === "TB" ? v.volume * base : v.volume;
  const totalGB = toGB(B);
  const partitions = Math.ceil(totalGB * B / v.partitionMB);
  const parallel = v.nodes * v.coresPerNode;
  const waves = Math.ceil(partitions / parallel);
  const memUsable = v.ramPerNodeGB * v.usablePct / 100;
  const memPerExec = memUsable / v.execPerNode;
  const corePerExec = Math.floor(v.coresPerNode / v.execPerNode);
  const maxTaskMem = Math.floor(memPerExec / v.memPerTaskGB);
  const effTasks = Math.min(corePerExec, maxTaskMem);
  const oom = corePerExec > maxTaskMem;
  const effParallel = v.nodes * v.execPerNode * effTasks;
  const shuffleGB = totalGB * v.expansion;
  const tput = v.diskMBs / B;
  const worst = shuffleGB / tput / 60;
  const best = shuffleGB / (tput * v.nodes) / 60;
  const altWorst = toGB(altB) * v.expansion / (v.diskMBs / altB) / 60;
  const factor = worst / v.slaMin;
  const nodesNew = Math.ceil(v.nodes * factor);
  const coresNew = Math.ceil(v.coresPerNode * factor);
  const expTarget = v.expansion * v.slaMin / worst;
  return {
    B, altB, totalGB, partitions, parallel, waves, memUsable, memPerExec, corePerExec, maxTaskMem, effTasks, oom,
    bound: oom ? "Memory-bound" : "CPU-bound", effParallel, shuffleGB, tput, worst, best, altWorst, factor,
    meets: factor <= 1, nLow: Math.max(1, Math.floor(factor)), nHigh: Math.floor(factor) + 1, isInt: Number.isInteger(factor),
    nodesNew, coresNew, expTarget,
    timeA: worst * v.nodes / nodesNew, timeB: worst * v.coresPerNode / coresNew, timeC: v.slaMin,
    ramForCores: v.ramPerNodeGB * coresNew / v.coresPerNode
  };
}

function storageCalc(v, db) {
  const R = v.retentionMonths, H = 36, hr = 1 + v.headroomPct / 100, GiB = 1024 ** 3;
  const T = m => v.growthMode === "daily" ? v.growthDaily * 30.4 * m : v.rows0 * (Math.pow(1 + v.growthMonthlyPct / 100, m) - 1);
  const rowsAt = m => T(m) - T(Math.max(0, m - R)) + v.rows0 * Math.max(0, 1 - m / R);
  const at = m => {
    const rows = rowsAt(m), raw = rows * v.rowBytes / GiB, comp = raw / v.compression;
    const idx = comp * v.indexCount * v.indexOverheadPct / 100, single = comp + idx, repl = single * v.rf;
    return { m, rows, raw, comp, idx, single, repl, total: repl * hr };
  };
  const series = Array.from({ length: H + 1 }, (_, m) => at(m));
  const peak = series.reduce((a, b) => b.total > a.total ? b : a);
  const writeQps = v.peakQps * (1 - v.readPct / 100), readQps = v.peakQps * v.readPct / 100;
  const vcpuTotal = Math.ceil(v.peakQps / v.qpsPerVcpu * hr);
  const storageShards = Math.ceil(peak.single * hr / (v.maxDiskTB * 1024));
  const computeShards = Math.ceil(vcpuTotal / v.maxVcpuPerNode);
  const shards = Math.max(1, storageShards, computeShards);
  const nodes = shards * v.rf;
  const vcpuNode = roundStd(Math.max(2, Math.ceil(vcpuTotal / shards)), VCPU_STEPS);
  const hotGB = peak.single / shards * v.hotPct / 100;
  const connGB = v.connections / shards * v.memPerConnMB / 1024;
  const ramNeed = hotGB + connGB + 2;
  const ramNode = roundStd(Math.max(ramNeed, vcpuNode * 2), RAM_STEPS);
  const diskNode = peak.single / shards * hr;
  const iops = Math.ceil((writeQps * v.ioPerWrite + readQps * (1 - v.cacheHitPct / 100) * v.ioPerRead) * hr);
  const iopsNode = Math.ceil(iops / shards);
  const diskType = db.columnar ? "NVMe SSD (throughput scan tinggi)" : iopsNode > 20000 ? "NVMe SSD" : iopsNode > 3000 ? "SSD dengan provisioned IOPS" : "SSD general purpose";
  const netMbps = (v.peakQps * v.respKB * 8.192 / 1000 + writeQps * v.rowBytes * 8 / 1e6 * (v.rf - 1)) * hr;
  const nic = netMbps <= 800 ? "1 Gbps" : netMbps <= 8000 ? "10 Gbps" : "25 Gbps atau lebih";
  const ctx = { ram: ramNode, vcpu: vcpuNode, conn: v.connections, iops: iopsNode, single: peak.single };
  const params = db.params.map(p => Object.assign({}, p, { value: p.calc(ctx) }));
  const onprem = {
    hw: nodes * v.serverUSD / v.amortMonths,
    disk: peak.total / 1024 * v.diskUSDperTB / v.amortMonths,
    power: nodes * v.wattsPerNode / 1000 * 730 * v.pue * v.kwhUSD,
    ops: nodes * v.opsPerNodeUSD
  };
  onprem.total = onprem.hw + onprem.disk + onprem.power + onprem.ops;
  const cloud = {
    compute: nodes * (vcpuNode * v.vcpuHrUSD + ramNode * v.ramGbHrUSD) * 730,
    storage: peak.total * v.storageGbMonthUSD,
    egress: v.egressGB * v.egressUSDperGB
  };
  cloud.total = cloud.compute + cloud.storage + cloud.egress;
  return { series, peak, writeQps, readQps, vcpuTotal, storageShards, computeShards, shards, nodes, vcpuNode, hotGB, connGB, ramNeed, ramNode, diskNode, iops, iopsNode, diskType, netMbps, nic, params, onprem, cloud };
}

function clearMarks(root) {
  $$("mark.hl", root).forEach(m => { const p = m.parentNode; m.replaceWith(document.createTextNode(m.textContent)); p.normalize(); });
}
function highlight(root, q) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.nodeValue.toLowerCase().includes(q) && n.parentElement && !n.parentElement.closest("option,textarea,svg,mark,.no-hl") ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const text = n.nodeValue, low = text.toLowerCase(), frag = document.createDocumentFragment();
    let i = 0, j;
    while ((j = low.indexOf(q, i)) !== -1) {
      frag.append(text.slice(i, j));
      const m = document.createElement("mark"); m.className = "hl"; m.textContent = text.slice(j, j + q.length); frag.append(m);
      i = j + q.length;
    }
    frag.append(text.slice(i));
    n.replaceWith(frag);
  });
}

      const rg = $(`#imp-${P}-${c.id}`, body); rg.value = st.wizard.importance[c.id]; rg.nextElementSibling.textContent = rg.value;
    });
    $$(".preset", body).forEach(b => b.setAttribute("aria-pressed", b.dataset.preset === st.wizard.preset));
  };

  const update = () => {
    const R = wizardScores(W, st.wizard);
    $("[data-role=progress]", body).textContent = `${R.answered}/${W.criteria.length} kriteria dijawab`;
    $("[data-role=result]", body).innerHTML = wizardResultHTML(W, R);
    const byId = id => R.steps.find(s => s.step.id === id);
    st.wizardResult = R.answered ? {
      deployment: byId("deployment")?.winner?.id, licensing: byId("licensing")?.winner?.id,
      provider: byId("provider")?.visible ? byId("provider").winner?.id : null,
      label: R.steps.filter(s => s.visible && s.winner).map(s => s.winner.label).join(" · ")
    } : null;
    st.wizardLast = R;
    bus.dispatchEvent(new CustomEvent("wizard", { detail: t.id }));
  };

  body.addEventListener("change", e => {
    const el = e.target;
    if (el.dataset.crit) { st.wizard.answers[el.dataset.crit] = el.value; st.wizard.preset = null; syncInputs(); update(); }
  });
  body.addEventListener("input", e => {
    const el = e.target;
    if (el.dataset.imp) { st.wizard.importance[el.dataset.imp] = +el.value; el.nextElementSibling.textContent = el.value; update(); }
  });
  body.addEventListener("click", e => {
    const pre = e.target.closest("[data-preset]"), act = e.target.closest("[data-act]");
    if (pre) {
      const p = W.presets.find(x => x.id === pre.dataset.preset);
      st.wizard = fresh();
      Object.assign(st.wizard.answers, p.answers);
      Object.assign(st.wizard.importance, p.importance || {});
      st.wizard.preset = p.id;
      syncInputs(); update(); toast(`Preset “${p.label}” diterapkan`);
    } else if (act?.dataset.act === "reset") {
      st.wizard = fresh(); syncInputs(); update(); toast("Wizard direset");
    } else if (act?.dataset.act === "export") {
      copyText(wizardExportText(W, st), "Ringkasan wizard disalin ke clipboard");
    }
  });
  update();
}

function topContrib(o, sign, n) {
  return o.contrib.filter(c => sign > 0 ? c.val > 0 : c.val < 0).sort((a, b) => sign > 0 ? b.val - a.val : a.val - b.val).slice(0, n);
}
function contribLine(c) {
  return `${esc(c.crit.label)}: “${esc(c.ans.label)}” <span class="mono muted">(${signed(c.raw)} × bobot ${c.imp} = ${signed(c.val)})</span>`;
}
function divergingBars(list, winnerId) {
  const max = Math.max(1, ...list.map(o => Math.abs(o.score)));
  return `<div class="dbars">${list.map(o => {
    const w = Math.abs(o.score) / max * 50, pos = o.score >= 0;
    return `<div class="dbar${o.id === winnerId ? " win" : ""}"><span class="dbar-l" title="${esc(o.label)}">${esc(o.label)}</span><span class="dbar-track" aria-hidden="true"><span class="dbar-fill ${pos ? "pos" : "neg"}" style="${pos ? "left" : "right"}:50%;width:${w}%"></span></span><span class="dbar-v">${signed(o.score)}</span></div>`;
  }).join("")}</div>`;
}
function wizardResultHTML(W, R) {
  const formula = `<details class="formula"><summary>Lihat rumus</summary><pre>${esc(W.formula)}</pre></details>`;
  if (!R.answered) return `<h3>Hasil</h3><p class="muted">Jawab minimal satu kriteria atau pilih preset. Skor dihitung ulang setiap kali jawaban atau bobot berubah.</p>${formula}`;
  const vis = R.steps.filter(s => s.visible);
  const winners = vis.map(s => s.winner);
  const steps = R.steps.map(s => {
    if (!s.visible) return `<section class="res-step"><h4>${esc(s.step.title)}</h4><p class="muted" style="font-size:13px">Tidak relevan karena hasil Langkah 1 adalah ${esc(R.steps[0].winner.label)}.</p></section>`;
    return `<section class="res-step"><h4><span>${esc(s.step.title)}</span>${s.tie ? `<span class="badge warn">Seri</span>` : ""}</h4>${divergingBars(s.list, s.winner.id)}</section>`;
  }).join("");
  const why = vis.map(s => {
    const pos = topContrib(s.winner, 1, 3);
    return `<li><b>${esc(s.winner.label)}</b>${pos.length ? `<ul class="res-list" style="margin-top:4px">${pos.map(c => `<li>${contribLine(c)}</li>`).join("")}</ul>` : ` <span class="muted">— belum ada kriteria yang mendukung secara positif.</span>`}</li>`;
  }).join("");
  const against = winners.flatMap(w => topContrib(w, -1, 2).map(c => Object.assign({ opt: w }, c)));
  const ties = vis.filter(s => s.tie);
  return `
    <div class="rec"><span class="eyebrow">Rekomendasi teratas</span><b>${winners.map(w => esc(w.label)).join(" + ")}</b></div>
    ${ties.length ? `<p class="alert warn">Skor seri di ${ties.map(s => esc(s.step.title)).join(", ")}: ${ties.map(s => s.tie.map(o => esc(o.label)).join(" / ")).join("; ")}. Naikkan bobot kriteria yang paling penting untuk memecah seri.</p>` : ""}
    ${steps}
    <section class="res-block"><h4>Mengapa</h4><ul class="res-list">${why}</ul></section>
    ${against.length ? `<section class="res-block"><h4>Kriteria yang menentang</h4><ul class="res-list">${against.map(c => `<li><b>${esc(c.opt.label)}</b> — ${contribLine(c)}</li>`).join("")}</ul></section>` : ""}
    <section class="res-block"><h4>Trade-off</h4><ul class="res-list">${winners.flatMap(w => w.tradeoffs).map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>
    <section class="res-block"><h4>Risiko</h4><ul class="res-list">${winners.flatMap(w => w.risks).map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>
    ${formula}`;
}
function wizardExportText(W, st) {
  const R = wizardScores(W, st.wizard);
  if (!R.answered) return "Decision Wizard: belum ada kriteria yang dijawab.";
  const vis = R.steps.filter(s => s.visible), L = [];
  L.push(`DECISION WIZARD — ${KB_DATA.meta.title} (${fmtDate(KB_DATA.meta.updated)})`);
  L.push(`Rekomendasi: ${vis.map(s => s.winner.label).join(" + ")}`, "");
  R.steps.forEach(s => L.push(`${s.step.title}: ${s.visible ? s.list.map(o => `${o.label} ${signed(o.score)}`).join(" | ") : "tidak relevan"}`));
  L.push("", "Kontributor utama:");
  vis.forEach(s => topContrib(s.winner, 1, 3).forEach(c => L.push(`- ${s.winner.label}: ${c.crit.label} = ${c.ans.label} (${signed(c.raw)} × ${c.imp} = ${signed(c.val)})`)));
  L.push("", "Trade-off:"); vis.forEach(s => s.winner.tradeoffs.forEach(x => L.push(`- ${x}`)));
  L.push("", "Risiko:"); vis.forEach(s => s.winner.risks.forEach(x => L.push(`- ${x}`)));
  L.push("", "Jawaban:");
  W.criteria.forEach(c => { const a = c.answers.find(x => x.id === st.wizard.answers[c.id]); L.push(`- ${c.label}: ${a ? a.label : "(belum dijawab)"} [bobot ${st.wizard.importance[c.id]}]`); });
  return L.join("\n");
}

/* ---------- 7b. Tool Explorer ---------- */
function fitIssues(tool, wr, provLabel) {
  if (!wr) return [];
  const out = [], big3 = ["gcp", "aws", "azure"];
  if (wr.deployment === "onprem" && tool.env === "Cloud") out.push("hanya tersedia di cloud, sedangkan hasil wizard On-Premise");
  if (wr.deployment === "cloud" && tool.env === "On-Prem") out.push("khusus on-prem, sedangkan hasil wizard Cloud");
  if (wr.licensing === "oss" && tool.license === "Enterprise") out.push("berlisensi Enterprise, sedangkan hasil wizard Open Source");
  if (wr.licensing === "enterprise" && tool.license === "Open Source" && tool.setup === "Tinggi") out.push("setup sulit untuk self-managed, sedangkan hasil wizard Enterprise/Managed");
  if (wr.provider && big3.includes(wr.provider) && big3.includes(tool.provider) && tool.provider !== wr.provider) out.push(`milik ${provLabel[tool.provider]}, sedangkan hasil wizard ${provLabel[wr.provider]}`);
  return out;
}
function evalCompat(T, picks, cluster) {
  const sel = Object.values(picks).map(id => T.items.find(i => i.id === id)).filter(Boolean);
  const ids = new Set(sel.map(s => s.id)), out = [];
  T.compatRules.forEach(r => {
    if (r.type === "requires") {
      if (ids.has(r.tool) && !r.needsAny.some(x => ids.has(x))) out.push(r);
    } else if (r.type === "distinctProvider") {
      const prov = [...new Set(sel.map(s => s.provider).filter(p => r.providers.includes(p)))];
      if (prov.length > r.max) out.push({ level: r.level, text: r.text.replace("{providers}", prov.map(p => T.providers[p]).join(", ")) });
    } else if (r.type === "envMix") {
      const on = sel.filter(s => s.env === "On-Prem"), cl = sel.filter(s => s.env === "Cloud");
      if (on.length && cl.length) out.push({ level: r.level, text: r.text.replace("{onprem}", on.map(s => s.name).join(", ")).replace("{cloud}", cl.map(s => s.name).join(", ")) });
    } else if (r.type === "clusterNeedsEngine") {
      if (cluster && !r.needsAny.some(x => ids.has(x))) out.push(r);
    }
  });
  return out;
}
function flowSVG(sel, P) {
  const main = sel.filter(x => x.c.flow === "main").sort((a, b) => a.c.flowOrder - b.c.flowOrder);
  const sup = sel.filter(x => x.c.flow !== "main").sort((a, b) => a.c.flowOrder - b.c.flowOrder);
  const W = 300, bw = 260, bh = 46, gap = 22, x0 = (W - bw) / 2;
  let y = 6, s = "";
  main.forEach((x, i) => {
    s += `<rect class="fl-box ${x.tool ? "on" : "off"}" x="${x0}" y="${y}" width="${bw}" height="${bh}" rx="6"/>
      <text class="fl-k" x="${x0 + 12}" y="${y + 17}">${esc(x.c.short)}</text>
      <text class="fl-n${x.tool ? "" : " off"}" x="${x0 + 12}" y="${y + 36}">${esc(trunc(x.tool ? x.tool.name : "belum dipilih", 32))}</text>`;
    if (i < main.length - 1) s += `<line class="fl-a" x1="${W / 2}" y1="${y + bh + 2}" x2="${W / 2}" y2="${y + bh + gap - 4}" marker-end="url(#arr-${P})"/>`;
    y += bh + gap;
  });
  s += `<text class="fl-k" x="${x0}" y="${y + 2}">Lintas tahap</text>`;
  y += 10;
  const cw = (bw - 8) / 2, ch = 38;
  sup.forEach((x, i) => {
    const cx = x0 + (i % 2) * (cw + 8), cy = y + Math.floor(i / 2) * (ch + 8);
    s += `<rect class="fl-box ${x.tool ? "on" : "off"}" x="${cx}" y="${cy}" width="${cw}" height="${ch}" rx="5"/>
      <text class="fl-k" x="${cx + 8}" y="${cy + 14}">${esc(x.c.short)}</text>
      <text class="fl-n sm${x.tool ? "" : " off"}" x="${cx + 8}" y="${cy + 30}">${esc(trunc(x.tool ? x.tool.name : "—", 19))}</text>`;
  });
  const H = y + Math.ceil(sup.length / 2) * (ch + 8);
  const aria = "Alur stack: " + main.map(x => `${x.c.short} ${x.tool ? x.tool.name : "belum dipilih"}`).join(", lalu ");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}"><defs><marker id="arr-${P}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fl-ah" d="M0 0L10 5L0 10z"/></marker></defs>${s}</svg>`;
}
function renderTools(t, sec, body) {
  const T = t[sec.source], st = tstate(t.id), P = t.slug;
  st.tools = { env: "all", license: "all", cat: "all", picks: {} };
  const seg = (name, key, opts) => `<fieldset class="seg"><legend class="sr">${name}</legend>${opts.map(([v, l]) => `<label class="seg-opt"><input type="radio" name="tx-${key}-${P}" value="${v}" data-filter="${key}" ${v === "all" ? "checked" : ""}><span>${l}</span></label>`).join("")}</fieldset>`;
  body.innerHTML = `
  <div class="tx">
    <div class="tx-main">
      <div class="filters" role="group" aria-label="Filter tool">
        <div class="frow"><span class="flabel" aria-hidden="true">Lingkungan</span>${seg("Lingkungan", "env", [["all", "Semua"], ["On-Prem", "Bisa On-Prem"], ["Cloud", "Bisa Cloud"], ["Keduanya", "Keduanya"]])}</div>
        <div class="frow"><span class="flabel" aria-hidden="true">Lisensi</span>${seg("Lisensi", "license", [["all", "Semua"], ["Open Source", "Open Source"], ["Enterprise", "Enterprise"]])}</div>
        <div class="frow"><label class="flabel" for="tx-cat-${P}">Kategori</label><select id="tx-cat-${P}" data-filter="cat"><option value="all">Semua kategori (${T.categories.length})</option>${T.categories.map(c => `<option value="${c.id}">${esc(c.label)}</option>`).join("")}</select></div>
        <p class="fitnote" data-role="fitnote"></p>
        <p class="fitnote">Cari nama tool, pros, atau cons lewat kolom “Cari di tab ini” di atas. <a href="#stack-${P}">Lihat Stack Saya</a></p>
      </div>
      <div data-role="grid" style="display:grid;gap:22px"></div>
    </div>
    <aside class="stack" id="stack-${P}" data-role="stack" aria-label="Stack Saya" tabindex="-1"></aside>
  </div>`;
  const envOk = (f, it) => f === "all" || (f === "Keduanya" ? it.env === "Keduanya" : it.env === f || it.env === "Keduanya");

  const paintGrid = () => {
    const f = st.tools, wr = st.wizardResult;
    $("[data-role=fitnote]", body).innerHTML = wr
      ? `Hasil Decision Wizard: <b>${esc(wr.label)}</b>. Tool yang tidak sesuai diberi badge “Kurang cocok” dan tetap ditampilkan.`
      : `Belum ada hasil Decision Wizard. Isi wizard agar tool yang kurang sesuai ditandai otomatis.`;
    const html = T.categories.filter(c => f.cat === "all" || c.id === f.cat).map(c => {
      const items = T.items.filter(it => it.cat === c.id && envOk(f.env, it) && (f.license === "all" || it.license === f.license));
      if (!items.length) return "";
      return `<section class="cat s-group"><div class="cat-h"><h3>${esc(c.label)}</h3><p>${esc(c.desc)}</p></div><div class="cards">${items.map(it => toolCard(it, f.picks[c.id] === it.id, fitIssues(it, wr, T.providers), T)).join("")}</div></section>`;
    }).join("");
    $("[data-role=grid]", body).innerHTML = html || `<p class="empty">Tidak ada tool yang cocok dengan filter ini. Ubah filter Lingkungan, Lisensi, atau Kategori.</p>`;
    applySearch(t);
  };

  const paintStack = () => {
    const sel = T.categories.map(c => ({ c, tool: T.items.find(i => i.id === st.tools.picks[c.id]) }));
    const filled = sel.filter(x => x.tool).length, warns = evalCompat(T, st.tools.picks, st.cluster), cl = st.cluster;
    $("[data-role=stack]", body).innerHTML = `
      <div class="stack-head"><h3>Stack Saya</h3><span class="muted mono">${filled}/${sel.length} tahap</span></div>
      <div class="flow">${flowSVG(sel, P)}</div>
      ${cl ? `<div class="cluster"><span class="k">Compute Spark (dari Sizing Calculator)</span><b>${num(cl.nodes)} node × ${num(cl.cores)} core × ${num(cl.ram)} GB RAM</b><br><span class="muted">Total ${num(cl.nodes * cl.cores)} core, ${num(cl.nodes * cl.ram)} GB RAM · ${num(cl.waves)} waves · shuffle ~${num(cl.worst)} menit (worst)</span></div>` : ""}
      <div class="warns">${warns.length ? warns.map(w => `<p class="alert ${w.level}"><span>${esc(w.text)}</span></p>`).join("") : filled > 1 ? `<p class="alert good"><span>Tidak ada peringatan kompatibilitas untuk kombinasi ini.</span></p>` : `<p class="muted" style="font-size:13px">Pilih satu tool per kategori dengan tombol “Pilih”. Peringatan kompatibilitas muncul di sini.</p>`}</div>
      <ul class="stack-list">${sel.map(x => `<li><span>${esc(x.c.label)}</span><b>${x.tool ? esc(x.tool.name) : "—"}</b></li>`).join("")}</ul>
      <div class="btns"><button type="button" class="btn primary" data-act="copy-stack">Copy stack</button><button type="button" class="btn" data-act="clear-stack">Kosongkan</button></div>`;
  };

  body.addEventListener("change", e => {
    const k = e.target.dataset.filter;
    if (k) { st.tools[k] = e.target.value; paintGrid(); }
  });
  body.addEventListener("click", e => {
    const pick = e.target.closest("[data-pick]"), act = e.target.closest("[data-act]");
    if (pick) {
      const it = T.items.find(i => i.id === pick.dataset.pick);
      st.tools.picks[it.cat] = st.tools.picks[it.cat] === it.id ? undefined : it.id;
      if (!st.tools.picks[it.cat]) delete st.tools.picks[it.cat];
      paintGrid(); paintStack();
      $(`[data-pick="${it.id}"]`, body)?.focus();
    } else if (act?.dataset.act === "clear-stack") {
      st.tools.picks = {}; st.cluster = null; paintGrid(); paintStack(); toast("Stack dikosongkan");
    } else if (act?.dataset.act === "copy-stack") {
      const L = ["STACK SAYA", ...T.categories.map(c => `${c.label}: ${T.items.find(i => i.id === st.tools.picks[c.id])?.name || "—"}`)];
      if (st.cluster) L.push(`Compute Spark: ${st.cluster.nodes} node × ${st.cluster.cores} core × ${st.cluster.ram} GB RAM`);
      const w = evalCompat(T, st.tools.picks, st.cluster);
      if (w.length) L.push("", "Peringatan:", ...w.map(x => "- " + x.text));
      copyText(L.join("\n"), "Ringkasan stack disalin ke clipboard");
    }
  });
  bus.addEventListener("wizard", e => { if (e.detail === t.id) paintGrid(); });
  bus.addEventListener("cluster", e => { if (e.detail === t.id) paintStack(); });
  paintGrid(); paintStack();
}

// Field generik: number input atau select. kind "text" = nilai string.
function fieldHTML(prefix, f, val, optionsList) {
  const id = `${prefix}-${f.id}`;
  const control = optionsList
    ? `<select id="${id}" data-f="${f.id}">${optionsList.map(o => `<option value="${esc(o.value)}" ${String(o.value) === String(val) ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>`
    : `<input type="number" id="${id}" data-f="${f.id}" value="${val}" step="${f.step || "any"}" min="${f.min ?? 0}" ${f.max != null ? `max="${f.max}"` : ""} inputmode="decimal" aria-describedby="${f.help ? id + "-h " : ""}${id}-e">`;
  return `<div class="field" data-field="${f.id}"><label for="${id}">${esc(f.label)}${f.unit ? ` <span class="unit">(${esc(f.unit)})</span>` : ""}</label>${control}${f.help ? `<p class="fh" id="${id}-h">${esc(f.help)}</p>` : ""}<p class="err" id="${id}-e" hidden></p></div>`;
}
function readField(f, raw) { return f.kind === "text" ? raw : raw === "" ? NaN : parseFloat(raw); }
function validateFields(fields, v) {
  const errs = {};
  fields.forEach(f => {
    if (f.kind === "text") return;
    const x = v[f.id], min = f.min ?? null;
    if (!Number.isFinite(x)) errs[f.id] = "Wajib diisi dengan angka.";
    else if (min === null && x <= 0) errs[f.id] = "Harus lebih dari 0.";
    else if (min !== null && x < min) errs[f.id] = `Tidak boleh kurang dari ${num(min)}.`;
    else if (f.max != null && x > f.max) errs[f.id] = `Maksimal ${num(f.max)}.`;
  });
  return errs;
}
function showErrors(root, prefix, fields, errs) {

function renderSpark(t, SP, root) {

    <div class="calc-summary" data-role="summary" aria-live="polite"></div>

        <div class="field">

      </form>
      <div class="calc-out">
        <div data-role="steps" style="display:grid;gap:14px"></div>
        <p class="disclaimer">Hasil adalah estimasi kasar berbasis model linear dan wajib divalidasi dengan benchmark atau job nyata (Spark UI: durasi stage, shuffle read/write, spill).</p>
      </div>

  const allFields = [{ id: "volume" }].concat(SP.fields);

    SP.fields.forEach(f => { $(`#${P}-${f.id}`, root).value = v[f.id]; });

    const divBad = Number.isFinite(v.coresPerNode) && Number.isFinite(v.execPerNode) && v.execPerNode > 0 && v.coresPerNode % v.execPerNode !== 0;
    dw.hidden = !divBad;
    dw.textContent = divBad ? `Executor per node (${num(v.execPerNode)}) tidak habis membagi core per node (${num(v.coresPerNode)}). Sisa ${num(v.coresPerNode % v.execPerNode)} core per node tidak terpakai.` : "";
    if (Object.keys(errs).length) {
      $("[data-role=summary]", root).innerHTML = `<p class="alert bad"><span>Perbaiki ${Object.keys(errs).length} input yang belum valid untuk melihat hasil.</span></p>`;
      $("[data-role=steps]", root).innerHTML = "";
      st.sparkLast = null; applySearch(t); return;
    }
    const r = sparkCalc(v);
    st.sparkLast = r;
    $("[data-role=summary]", root).innerHTML = sparkSummaryHTML(v, r);
    $("[data-role=steps]", root).innerHTML = sparkStepsHTML(SP, v, r, st.openF);

    update();

function sparkStepsHTML(SP, v, r, openF) {

    inputs: [["RAM/node", `${num(v.ramPerNodeGB)} GB`], ["Usable", `${num(v.usablePct)}%`], ["Executor/node", num(v.execPerNode)], ["Batas memori/task", `${num1(v.memPerTaskGB)} GB`]],
    result: big(`~${num(r.memUsable, 1)} GB`, "usable per node") + big(`~${num(r.memPerExec, 1)} GB`, "per executor") + big(num(r.corePerExec), "core per executor") + big(num(r.maxTaskMem), "max task by memory") + big(num(r.effTasks), "task efektif/executor"),
    extra: `<p class="note"><b>Faktor pembatas: ${r.bound}.</b> ${r.oom
      ? `Setiap executor punya ${num(r.corePerExec)} core, tetapi memori hanya cukup untuk ${num(r.maxTaskMem)} task. Kurangi executor.cores, naikkan RAM, atau turunkan beban memori per task. Task paralel efektif turun menjadi ${num(r.effParallel)}.`
      : `Memori cukup untuk ${num(r.maxTaskMem)} task per executor, tetapi hanya ada ${num(r.corePerExec)} core. Pembatasnya CPU (${num(r.effTasks)} task), bukan memori.`}</p>`,
    interp: r.oom ? "Memori menjadi pembatas; job berisiko gagal karena OOM sebelum masalah kecepatan muncul." : "Memori aman; kecepatan ditentukan oleh jumlah core.",
    formula: F.s3, calc: `mem_usable = ${num(v.ramPerNodeGB)} × ${num(v.usablePct)}% = ${num(r.memUsable, 2)} GB\nmem_per_executor = ${num(r.memUsable, 2)} ÷ ${num(v.execPerNode)} = ${num(r.memPerExec, 2)} GB\ncore_per_executor = floor(${num(v.coresPerNode)} ÷ ${num(v.execPerNode)}) = ${num(r.corePerExec)}\nmax_task_by_memory = floor(${num(r.memPerExec, 2)} ÷ ${num1(v.memPerTaskGB)}) = ${num(r.maxTaskMem)}\ntask_efektif = min(${num(r.corePerExec)}, ${num(r.maxTaskMem)}) = ${num(r.effTasks)}` });

  const s4 = stepCard({ no: 4, key: "s4", open: openF.has("s4"), title: "Estimasi biaya shuffle",
    inputs: [["Total data", `${num(r.totalGB)} GB`], ["Faktor ekspansi", `${num1(v.expansion)}x`], ["Throughput disk", `${num(v.diskMBs)} MB/s = ${num(r.tput, 3)} GB/s`], ["Node", num(v.nodes)]],
    result: big(fmtGB(r.shuffleGB), "data shuffle") + big(`~${num(r.worst)} mnt`, "worst case (satu disk)") + big(`~${num(r.best)} mnt`, "best case (disk paralel)"),
    extra: `<p class="note">Versi ${altLabel}: ~${num(r.altWorst)} menit worst case. Selisih muncul karena konversi satuan; contoh sumber membulatkan 3 TB = 3.000 GB sehingga mendapat ~100 menit.</p>
      <div style="display:grid;gap:6px">${rules.map(x => `<p class="alert ${x.level}"><span>${esc(x.text)}</span></p>`).join("")}</div>`,
    interp: "Shuffle biasanya menjadi komponen terlama; skenario nyata berada di antara best dan worst case.",
    formula: F.s4, calc: `shuffle_GB = ${num(r.totalGB)} × ${num1(v.expansion)} = ${num(r.shuffleGB)}\nworst = ${num(r.shuffleGB)} ÷ ${num(r.tput, 4)} ÷ 60 = ${num(r.worst, 1)} menit\nbest = ${num(r.shuffleGB)} ÷ (${num(r.tput, 4)} × ${num(v.nodes)}) ÷ 60 = ${num(r.best, 1)} menit` });
  const rows = [

    inputs: [["Waktu worst", `~${num(r.worst, 1)} menit`], ["SLA", `${num(v.slaMin)} menit`]],

        <tbody>
          <tr><td>a) Tambah node</td><td>${num(v.nodes)} → ${num(r.nodesNew)} node</td><td>~${num(r.timeA)} mnt</td><td>~${num1(r.nodesNew / v.nodes)}x biaya compute; disk ikut bertambah</td></tr>
          <tr><td>b) Tambah core/node</td><td>${num(v.coresPerNode)} → ${num(r.coresNew)} core</td><td>~${num(r.timeB)} mnt*</td><td>RAM ikut naik ke ~${num(r.ramForCores)} GB/node agar rasio sama</td></tr>
          <tr><td>c) Kurangi shuffle</td><td>ekspansi ${num1(v.expansion)}x → ≤ ${num1(r.expTarget)}x (${fmtGB(r.totalGB * r.expTarget)})</td><td>~${num(r.timeC)} mnt</td><td>Tanpa hardware baru; butuh refactor join, filter awal, broadcast</td></tr>
        </tbody></table></div>
      <p class="fh">* Opsi b hanya efektif bila throughput disk per node ikut naik (lebih banyak disk/NVMe). Menambah core saja tidak mempercepat I/O.</p>
      ${hbars(rows, v.slaMin, `SLA ${num(v.slaMin)} menit`)}`,
    interp: "Ini masalah optimasi matematis, bukan masalah config Spark.",
    formula: F.s5, calc: `faktor_scale = ${num(r.worst, 1)} ÷ ${num(v.slaMin)} = ${num(r.factor, 2)}\nnode_baru = ceil(${num(v.nodes)} × ${num(r.factor, 2)}) = ${num(r.nodesNew)}\ncore_baru = ceil(${num(v.coresPerNode)} × ${num(r.factor, 2)}) = ${num(r.coresNew)}\nekspansi_target = ${num1(v.expansion)} × ${num(v.slaMin)} ÷ ${num(r.worst, 1)} = ${num(r.expTarget, 2)}` });
  return s1 + s2 + s3 + s4 + s5;
}

    }

function storageSummary(v, r, db, html) {

const paramVal = p => typeof p.value === "number" ? (p.unit === "GB" ? num(p.value, 1) + " GB" : p.unit === "MB" ? num(p.value) + " MB" : num(p.value, 2)) : p.value;
function lineChart(series) {
  const W = 640, H = 260, L = 70, R = 18, T = 18, B = 34;
  const maxY = niceMax(Math.max(...series.map(p => p.total)));
  const x = m => L + (W - L - R) * m / (series.length - 1), y = v => T + (H - T - B) * (1 - v / maxY);
  let s = "";
  for (let i = 0; i <= 4; i++) { const v = maxY * i / 4; s += `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax-t" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmtGB(v)}</text>`; }
  for (let m = 0; m < series.length; m += 6) s += `<text class="ax-t" x="${x(m)}" y="${H - 10}" text-anchor="middle">${m === 0 ? "Bulan 0" : m}</text>`;
  const pts = k => series.map(p => `${x(p.m).toFixed(1)},${y(p[k]).toFixed(1)}`).join(" ");
  s += `<polyline class="ln b" points="${pts("single")}"/><polyline class="ln a" points="${pts("total")}"/>`;
  [12, 24, 36].forEach(m => { const p = series[m]; s += `<circle class="dot" cx="${x(m)}" cy="${y(p.total)}" r="4"/><text class="dot-t" x="${x(m) - 6}" y="${y(p.total) - 9}" text-anchor="${m === 36 ? "end" : "middle"}">${fmtGB(p.total)}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyeksi storage 36 bulan: bulan 12 ${fmtGB(series[12].total)}, bulan 24 ${fmtGB(series[24].total)}, bulan 36 ${fmtGB(series[36].total)}">${s}</svg></div>
    <p class="legend"><span><i></i>Total disk (replika + buffer)</span><span><i class="alt"></i>Satu salinan (terkompresi + index)</span></p>`;
}
function storageOutHTML(SD, v, r, db, openF) {
  const F = SD.formulas, rowsT = [0, 12, 24, 36].map(m => r.series[m]);
  const fdet = (key, txt, calc) => `<details class="formula" data-fkey="${key}" ${openF.has(key) ? "open" : ""}><summary>Lihat rumus</summary><pre>${esc(txt)}${calc ? "\n\nDengan angka saat ini:\n" + esc(calc) : ""}</pre></details>`;
  const card = (title, inner, key, txt, calc) => `<article class="step s-item"><header><h4>${title}</h4></header>${inner}${fdet(key, txt, calc)}</article>`;
  const storage = card("Estimasi storage & proyeksi", `
    <div class="tbl-wrap"><table>
      <thead><tr><th>Komponen</th>${rowsT.map(p => `<th>Bulan ${p.m}</th>`).join("")}</tr></thead>
      <tbody>
        <tr><td>Baris tersimpan</td>${rowsT.map(p => `<td>${num(p.rows / 1e6, 1)} jt</td>`).join("")}</tr>
        <tr><td>Raw</td>${rowsT.map(p => `<td>${fmtGB(p.raw)}</td>`).join("")}</tr>
        <tr><td>Setelah kompresi (${num1(v.compression)}x)</td>${rowsT.map(p => `<td>${fmtGB(p.comp)}</td>`).join("")}</tr>
        <tr><td>+ Index (${num(v.indexCount)} × ${num(v.indexOverheadPct)}%)</td>${rowsT.map(p => `<td>${fmtGB(p.idx)}</td>`).join("")}</tr>
        <tr><td>Satu salinan</td>${rowsT.map(p => `<td>${fmtGB(p.single)}</td>`).join("")}</tr>
        <tr><td>× Replika (RF ${num(v.rf)})</td>${rowsT.map(p => `<td>${fmtGB(p.repl)}</td>`).join("")}</tr>
        <tr class="hi"><td>+ Buffer ${num(v.headroomPct)}% = Total</td>${rowsT.map(p => `<td>${fmtGB(p.total)}</td>`).join("")}</tr>
      </tbody></table></div>
    ${lineChart(r.series)}
    ${v.retentionMonths < 36 ? `<p class="fh">Retensi ${num(v.retentionMonths)} bulan: setelah bulan ke-${num(v.retentionMonths)}, data lama terhapus sehingga kurva melandai.</p>` : ""}`,
    "st-storage", F.storage, `bulan 36: baris = ${num(rowsT[3].rows)}; raw = ${fmtGB(rowsT[3].raw)}; total = ${fmtGB(rowsT[3].total)}`);
  const spec = card("Rekomendasi spesifikasi", `
    <div class="result">${big(num(r.nodes), `node (${num(r.shards)} shard × RF ${num(v.rf)})`)}${big(num(r.vcpuNode), "vCPU per node")}${big(num(r.ramNode) + " GB", "RAM per node")}${big(fmtGB(r.diskNode), "disk per node")}${big(num(r.iopsNode), "IOPS per node")}${big(r.nic, "jaringan")}</div>
    <dl class="kv">
      <div><dt>Jenis disk</dt><dd>${esc(r.diskType)}</dd></div>
      <div><dt>vCPU total (sebelum dibulatkan)</dt><dd>${num(r.vcpuTotal)}</dd></div>
      <div><dt>Kebutuhan RAM</dt><dd>${num(r.ramNeed, 1)} GB</dd></div>
      <div><dt>Bandwidth puncak</dt><dd>${num(r.netMbps)} Mbps</dd></div>
      <div><dt>Write / read QPS</dt><dd>${num(r.writeQps)} / ${num(r.readQps)}</dd></div>
    </dl>
    ${db.id === "columnar" ? `<p class="note">Untuk engine serverless, angka vCPU/RAM adalah ekuivalen kapasitas, bukan server yang Anda kelola.</p>` : ""}
    ${r.shards > 1 ? `<p class="note">Butuh ${num(r.shards)} shard karena ${r.storageShards >= r.computeShards ? "kapasitas disk per node" : "kebutuhan vCPU"} melebihi batas per node. Untuk ${esc(db.label)}, pertimbangkan ${db.columnar ? "cluster terdistribusi" : "partisi/sharding (misal Citus atau Vitess) atau arsitektur read replica"}.</p>` : ""}`,
    "st-spec", F.spec + "\n\n" + F.io,
    `vCPU_total = ceil(${num(v.peakQps)} ÷ ${num(v.qpsPerVcpu)} × ${num(1 + v.headroomPct / 100, 2)}) = ${num(r.vcpuTotal)}\nRAM = ${num(r.hotGB, 1)} (data panas) + ${num(r.connGB, 2)} (koneksi) + 2 = ${num(r.ramNeed, 1)} GB → ${num(r.ramNode)} GB\nIOPS = (${num(r.writeQps)} × ${num(v.ioPerWrite)} + ${num(r.readQps)} × ${num(1 - v.cacheHitPct / 100, 2)} × ${num(v.ioPerRead)}) × ${num(1 + v.headroomPct / 100, 2)} = ${num(r.iops)}`);
  const params = card(`Parameter konfigurasi kunci · ${esc(db.label)}`, `
    <div class="tbl-wrap"><table>
      <thead><tr><th>Parameter</th><th>Nilai</th><th style="text-align:left">Rumus</th></tr></thead>
      <tbody>${r.params.map(p => `<tr><td class="mono">${esc(p.name)}</td><td>${esc(paramVal(p))}</td><td style="text-align:left;white-space:normal">${esc(p.formula)}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="fh">Dihitung dari spesifikasi per node: ${num(r.ramNode)} GB RAM, ${num(r.vcpuNode)} vCPU, ${num(r.iopsNode)} IOPS, ${num(v.connections)} koneksi. Rule of thumb, perlu diverifikasi dengan dokumentasi versi DB yang dipakai.</p>`,
    "st-params", "Lihat kolom “Rumus” di tabel. Konteks: RAM, vCPU, IOPS per node dan jumlah koneksi.", "");
  const o = r.onprem, c = r.cloud, k = v.kurs;
  const row = (l, val) => `<dt>${l}</dt><dd>${usd(val)}</dd>`;
  const cost = card("Estimasi biaya bulanan", `
    <div class="cost-grid">
      <div class="cost${v.env === "onprem" ? " sel" : ""}"><h5><span>On-Prem</span>${v.env === "onprem" ? `<span class="badge ent">Dipilih</span>` : ""}</h5>
        <dl>${row("Hardware (amortisasi)", o.hw)}${row("Disk (amortisasi)", o.disk)}${row("Listrik × PUE", o.power)}${row("Ops & rack", o.ops)}<dt class="tot">Total</dt><dd class="tot">${usd(o.total)}</dd></dl>
        <p class="mono" style="font-size:13px">${idr(o.total, k)} / bulan</p></div>
      <div class="cost${v.env === "cloud" ? " sel" : ""}"><h5><span>Cloud</span>${v.env === "cloud" ? `<span class="badge ent">Dipilih</span>` : ""}</h5>
        <dl>${row("Compute", c.compute)}${row("Storage", c.storage)}${row("Egress", c.egress)}<dt class="tot">Total</dt><dd class="tot">${usd(c.total)}</dd></dl>
        <p class="mono" style="font-size:13px">${idr(c.total, k)} / bulan</p></div>
    </div>
    <p class="fh">Kurs ${num(k)} IDR/USD. Harga per unit adalah contoh dan bisa diubah di grup “Asumsi biaya”. Belum termasuk lisensi, backup, dan tenaga kerja engineering.</p>`,
    "st-cost", F.cost, `On-Prem: ${num(r.nodes)} × ${num(v.serverUSD)} ÷ ${num(v.amortMonths)} + … = ${usd(o.total)}\nCloud: ${num(r.nodes)} × (${num(r.vcpuNode)} × ${v.vcpuHrUSD} + ${num(r.ramNode)} × ${v.ramGbHrUSD}) × 730 + … = ${usd(c.total)}`);
  return storage + spec + params + cost;
}

/* ---------- 7d. Catatan ---------- */
function renderNotes(t, sec, body) {
  const notes = [...t[sec.source]].sort((a, b) => b.date.localeCompare(a.date));
  body.innerHTML = `<div class="notes">${notes.map(n => `
    <article class="note-e s-item">
      <div class="note-meta"><time datetime="${n.date}">${fmtDate(n.date)}</time><div class="tags">${n.tags.map(g => `<span class="tag">${esc(g)}</span>`).join("")}</div></div>
      <h4>${esc(n.title)}</h4>
      <p>${esc(n.body)}</p>
      <p class="note-src">Sumber: ${esc(n.source)}</p>
    </article>`).join("")}</div>`;
}

/* ---------- 7e. Checklist ---------- */
function renderChecklist(t, sec, body) {
  const C = t[sec.source], st = tstate(t.id), P = t.slug;
  st.checks = {};
  const total = C.groups.reduce((a, g) => a + g.items.length, 0);
  body.innerHTML = `<div class="cl-wrap">
    <p class="progress" data-role="progress"></p>
    ${C.groups.map((g, gi) => `<section class="cl-group s-group"><h4>${esc(g.title)}</h4>${g.items.map((it, ii) => `
      <div class="cl-item s-item"><input type="checkbox" id="cl-${P}-${gi}-${ii}" data-ck="${gi}-${ii}"><label for="cl-${P}-${gi}-${ii}"><span>${esc(it.text)}</span><small>${esc(it.detail)}</small></label></div>`).join("")}
    </section>`).join("")}</div>`;
  const prog = () => { $("[data-role=progress]", body).textContent = `${Object.values(st.checks).filter(Boolean).length}/${total} item selesai`; };
  body.addEventListener("change", e => { const k = e.target.dataset.ck; if (k) { st.checks[k] = e.target.checked; prog(); } });
  prog();
}

/* =====================================================================
   8. DAFTAR ISI (pencarian lintas topik)
   ===================================================================== */
const SKIP_KEYS = new Set(["slug", "id", "type", "source", "scores", "calc", "cat", "flow", "flowOrder", "updated", "date", "showIf", "level", "metric", "op", "needsAny", "tool", "providers", "defaults"]);
function collectStrings(obj, out = []) {
  if (typeof obj === "string") { if (obj.length > 2) out.push(obj); }
  else if (Array.isArray(obj)) obj.forEach(x => collectStrings(x, out));
  else if (obj && typeof obj === "object") Object.entries(obj).forEach(([k, v]) => { if (!SKIP_KEYS.has(k)) collectStrings(v, out); });
  return out;
}
const TOPIC_INDEX = TOPICS.map(t => ({ t, strings: [...new Set(collectStrings(t))] }));
function snippet(s, q) {
  const i = s.toLowerCase().indexOf(q), a = Math.max(0, i - 40), b = Math.min(s.length, i + q.length + 70);
  return (a > 0 ? "…" : "") + s.slice(a, b) + (b < s.length ? "…" : "");
}
function paintHome() {
  const input = $("#q-home"), q = input.value.trim().toLowerCase();
  const res = TOPIC_INDEX.map(({ t, strings }) => ({ t, hits: q ? strings.filter(s => s.toLowerCase().includes(q)) : [] })).filter(x => !q || x.hits.length);
  $("#toc-grid").innerHTML = res.map(({ t, hits }) => `
    <a class="toc-card" href="#${t.slug}" data-slug="${t.slug}">
      <p class="eyebrow">${t.sections.length} bagian${q ? ` · ${hits.length} kecocokan` : ""}</p>
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.desc)}</p>
      <div class="tags">${t.tags.map(g => `<span class="tag">${esc(g)}</span>`).join("")}</div>
      <p class="secs">Bagian: ${t.sections.map(s => esc(s.label)).join(" · ")}</p>
      ${q ? `<div class="snips">${hits.filter(h => h !== t.title && h !== t.desc).slice(0, 3).map(h => `<p>${esc(snippet(h, q))}</p>`).join("")}</div>` : ""}
    </a>`).join("");
  if (q) highlight($("#toc-grid"), q);
  $("#toc-empty").hidden = !(q && !res.length);
  $("#toc-empty").textContent = `Tidak ditemukan hasil untuk “${q}” di semua topik.`;
  $("#qs-home").textContent = q ? (res.length ? `${res.length} topik cocok. Klik kartu untuk membuka; kata kunci ikut disorot di dalam topik.` : "") : "";
}

/* =====================================================================
   9. SHELL, ROUTING, FOOTER, INIT
   ===================================================================== */
function topicPanelHTML(t) {
  return `<section class="topic-panel" role="tabpanel" id="panel-${t.slug}" data-slug="${t.slug}" aria-labelledby="tab-${t.slug}" hidden>
    <header class="topic-head">
      <div class="th-text"><p class="eyebrow">Topik · ${t.sections.length} bagian</p><h2>${esc(t.title)}</h2><p class="lede">${esc(t.desc)}</p></div>
      <div class="searchbox"><label for="q-${t.slug}">Cari di tab ini</label><input type="search" id="q-${t.slug}" placeholder="Judul, deskripsi, nama tool, isi checklist…" autocomplete="off"><p class="search-status" id="qs-${t.slug}" aria-live="polite"></p></div>
    </header>
    <div class="subtabs" role="tablist" aria-label="Bagian ${esc(t.title)}">${t.sections.map(s => `<button role="tab" id="stab-${t.slug}-${s.id}" data-sec="${s.id}" aria-controls="sec-${t.slug}-${s.id}" aria-selected="false" tabindex="-1">${esc(s.label)}<span class="cnt" id="cnt-${t.slug}-${s.id}" hidden></span></button>`).join("")}</div>
    ${t.sections.map(s => `<div class="sec" role="tabpanel" id="sec-${t.slug}-${s.id}" aria-labelledby="stab-${t.slug}-${s.id}" hidden><div class="sec-body"></div><p class="empty" id="emp-${t.slug}-${s.id}" hidden></p></div>`).join("")}
  </section>`;
}
function homePanelHTML() {
  return `<section class="topic-panel" role="tabpanel" id="panel-${HOME}" data-slug="${HOME}" aria-labelledby="tab-${HOME}" hidden>
    <header class="topic-head">
      <div class="th-text"><p class="eyebrow">Daftar Isi · ${TOPICS.length} topik</p><h2>Semua topik</h2><p class="lede">Klik kartu untuk membuka topik. Pencarian di sini menelusuri isi semua topik: kriteria, tool, rumus, checklist, dan catatan.</p></div>
      <div class="searchbox"><label for="q-home">Cari lintas semua topik</label><input type="search" id="q-home" placeholder="Misal: BigQuery, shuffle, compliance…" autocomplete="off"><p class="search-status" id="qs-home" aria-live="polite"></p></div>
    </header>
    <div class="toc-grid" id="toc-grid"></div>
    <p class="empty" id="toc-empty" hidden></p>
  </section>`;
}
function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
  if (!/^[a-z0-9-]+$/.test(h) || h === HOME) return { topic: null };
  for (const t of TOPICS) {
    if (h === t.slug) return { topic: t };
    const sec = h.startsWith(t.slug + "-") && t.sections.find(s => s.id === h.slice(t.slug.length + 1));
    if (sec) return { topic: t, section: sec.id };
  }
  return { topic: null };
}
function route() {
  const r = parseHash(), slug = r.topic ? r.topic.slug : HOME;
  setTabs($("#tabs"), slug, "slug");
  $$(".topic-panel").forEach(p => { p.hidden = p.dataset.slug !== slug; });
  if (!r.topic) return;
  const t = r.topic, st = tstate(t.id), secId = r.section || st.section || t.sections[0].id;
  st.section = secId;
  setTabs($(`#panel-${t.slug} .subtabs`), secId, "sec");
  t.sections.forEach(s => { $(`#sec-${t.slug}-${s.id}`).hidden = s.id !== secId; });
}
function buildFooter() {
  const m = KB_DATA.meta;
  $("#footer").innerHTML = `
    <p class="muted">${esc(m.disclaimer)} Terakhir diperbarui ${fmtDate(m.updated)} · versi ${esc(m.version)}.</p>
    <details><summary>Cara update knowledge base ini</summary>
      <div class="howto">${m.howTo.map(h => `<div><h4>${esc(h.title)}</h4><p>${esc(h.text)}</p>${h.code ? `<pre>${esc(h.code)}</pre>` : ""}</div>`).join("")}</div>
    </details>`;
}
function init() {
  const m = KB_DATA.meta;
  $("#mast-title").textContent = m.title;
  $("#mast-meta").textContent = `Knowledge base · v${m.version} · diperbarui ${fmtDate(m.updated)}`;
  const pd = KB_DATA.topics.pipelineDecision;
  $("#mast-stats").innerHTML = [[TOPICS.length, "topik"], [pd.tools.items.length, "tool"], [pd.wizard.criteria.length, "kriteria"], [pd.tools.categories.length, "kategori"]]
    .map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join("");

  const nav = $("#tabs");
  nav.innerHTML = [{ slug: HOME, title: "Daftar Isi" }].concat(TOPICS).map(t => `<button role="tab" id="tab-${t.slug}" data-slug="${t.slug}" aria-controls="panel-${t.slug}" aria-selected="false" tabindex="-1">${esc(t.title)}</button>`).join("");
  nav.addEventListener("click", e => { const b = e.target.closest("[role=tab]"); if (b) location.hash = b.dataset.slug; });
  wireTablist(nav);

  $("#main").innerHTML = homePanelHTML() + TOPICS.map(topicPanelHTML).join("");
  $("#q-home").addEventListener("input", paintHome);
  $("#toc-grid").addEventListener("click", e => {
    const card = e.target.closest(".toc-card"), q = $("#q-home").value.trim();
    if (!card || !q) return;
    const t = TOPICS.find(x => x.slug === card.dataset.slug), inp = $("#q-" + t.slug);
    inp.value = q; tstate(t.id).search = q; applySearch(t);
  });

  TOPICS.forEach(t => {
    const panel = $("#panel-" + t.slug), list = $(".subtabs", panel);
    list.addEventListener("click", e => { const b = e.target.closest("[role=tab]"); if (b) location.hash = `${t.slug}-${b.dataset.sec}`; });
    wireTablist(list);
    t.sections.forEach(s => {
      const body = $(`#sec-${t.slug}-${s.id} .sec-body`), fn = RENDERERS[s.type];
      if (fn) fn(t, s, body);
      else body.innerHTML = `<p class="empty">Tipe bagian “${esc(s.type)}” belum dikenal. Gunakan salah satu: ${Object.keys(RENDERERS).join(", ")}.</p>`;
    });
    $("#q-" + t.slug).addEventListener("input", e => { tstate(t.id).search = e.target.value; applySearch(t); });
    applySearch(t);
  });

  $("#copybox-close").addEventListener("click", () => { $("#copybox").hidden = true; });
  buildFooter();
  paintHome();
  window.addEventListener("hashchange", route);
  route();
}
if (typeof document !== "undefined") init();
</script>
